[project]
name = "hermes-antigravity"
version = "0.5.0"
description = "Google Antigravity (Cloud Code Assist) provider plugin for Hermes Agent"
authors = [
    { name = "Joseph" },
    { name = "Hermes Agent Contributors" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "starlette>=0.27.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.entry-points."hermes_agent.plugins"]
antigravity = "hermes_antigravity:register"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
