[project]
name = "hermes-antigravity-pi-port"
version = "0.4.1"
description = "Antigravity / Google Cloud Code Assist provider plugin for Hermes Agent"
authors = [
    { name = "Rahul Arya" },
    { name = "Hermes Agent Contributors" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-aiohttp>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
